name: Feature
description: A bounded product or engineering capability
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem are we solving and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is deliberately outside this issue?
  - type: textarea
    id: tests
    attributes:
      label: Test expectations
      description: Unit, API, integration, or migration scenarios required.
    validations:
      required: true

