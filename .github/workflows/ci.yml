name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sport_events
          POSTGRES_USER: sport_events
          POSTGRES_PASSWORD: sport_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sport_events -d sport_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPORT_EVENTS_TEST_DATABASE_URL: postgresql+asyncpg://sport_events:sport_events@localhost:5432/sport_events
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -m integration

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d
      - run: curl --fail --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:8000/api/v1/health/live
      - run: curl --fail --retry 15 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:8000/api/v1/health/ready
      - run: docker compose exec -T api alembic upgrade head
      - if: always()
        run: docker compose logs
