services:
  api:
    build: .
    environment:
      SPORT_EVENTS_DATABASE_URL: postgresql+asyncpg://sport_events:sport_events@postgres:5432/sport_events
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sport_events
      POSTGRES_USER: sport_events
      POSTGRES_PASSWORD: sport_events
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_events -d sport_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

