services:
  web:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - api

  api:
    build: .
    environment:
      SPORT_EVENTS_DATABASE_URL: postgresql+asyncpg://sport_events:sport_events@postgres:5432/sport_events
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  sync-worker:
    build: .
    # A running attempt gets 45 s to finish on stop; procrastinate then cancels it (journaled
    # and retried) before Docker's SIGKILL at the 60 s grace period.
    command:
      - procrastinate
      - --app=sport_events.sync_jobs.app.app
      - worker
      - --queues=football
      - --shutdown-graceful-timeout=45
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: false
    environment:
      SPORT_EVENTS_DATABASE_URL: postgresql+asyncpg://sport_events:sport_events@postgres:5432/sport_events
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sport_events
      POSTGRES_USER: sport_events
      POSTGRES_PASSWORD: sport_events
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_events -d sport_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

